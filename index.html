<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Retour vers le portail</title>
<style>
  body { font: 20px/1.4 system-ui, sans-serif; margin: 0; padding: 24px; background: #e8eceb; color: #18262e; }
  main { max-width: 560px; margin: 10vh auto; }
  code { display: block; padding: 12px; background: #f8faf9; border-radius: 10px; overflow-wrap: anywhere; font-size: 15px; }
  @media (prefers-color-scheme: dark) { body { background: #0e1a21; color: #e4ecee; } code { background: #172630; } }
</style>
</head>
<body>
<main>
  <h1>Retour vers le portail…</h1>
  <p id="msg">Un instant.</p>
</main>
<script>
  // Page relais du Portail Maison : Withings et Enable Banking (budget) exigent une adresse publique en https.
  // Elle renvoie simplement le navigateur vers le portail de la maison (adresse locale uniquement),
  // à la page de retour indiquée dans « state » (Withings par défaut).
  // Aucune donnée n'est enregistrée ni envoyée ailleurs.
  (function () {
    var params = new URLSearchParams(location.search);
    var msg = document.getElementById('msg');
    var origin = '';
    var page = '/api/bienetre/withings/retour';
    var pages = ['/api/bienetre/withings/retour', '/budget/retour'];
    try {
      var state = JSON.parse(atob((params.get('state') || '').replace(/-/g, '+').replace(/_/g, '/')));
      origin = state.r || '';
      if (pages.indexOf(state.p) >= 0) page = state.p;
    } catch (e) {}
    var local = /^https?:\/\/(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|[a-z0-9-]+\.local|maison\.laplanche)(:\d+)?$/i;
    if (local.test(origin)) {
      location.replace(origin + page + location.search);
      msg.textContent = 'Si rien ne se passe, vérifiez que vous êtes sur le Wi-Fi de la maison (ou sur WireGuard).';
    } else {
      msg.innerHTML = 'Copiez l’adresse de cette page et collez-la dans le portail (page Bien-être ou Budget) :';
      var code = document.createElement('code');
      code.textContent = location.href;
      msg.after(code);
    }
  })();
</script>
</body>
</html>
